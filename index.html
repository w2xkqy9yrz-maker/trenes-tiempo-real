<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trenes España en Tiempo Real</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-sidebar: #161b22;
            --bg-card: #21262d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border: #30363d;
            --accent-ave: #b620e0;
            --accent-avlo: #9e005d;
            --accent-alvia: #0070f3;
            --accent-md: #e056fd;
            --accent-cercanias: #00a8ff;
            --accent-green: #2ea44f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navbar */
        header {
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 60px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 164, 79, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 164, 79, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 164, 79, 0); }
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--text-main);
            background-color: var(--bg-card);
        }

        /* Main Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Left: Search & Filter Lists */
        .sidebar-left {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .filter-tags {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-tag {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .filter-tag.active {
            border-color: #58a6ff;
            background-color: rgba(56, 139, 253, 0.1);
        }

        .train-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .train-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .train-card:hover, .train-card.selected {
            border-color: #58a6ff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        .badge.ave { background-color: var(--accent-ave); }
        .badge.avlo { background-color: var(--accent-avlo); }
        .badge.alvia { background-color: var(--accent-alvia); }
        .badge.md { background-color: var(--accent-md); }
        .badge.cercanias { background-color: var(--accent-cercanias); }

        .status-dot {
            font-size: 0.8rem;
            color: var(--accent-green);
        }

        .train-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .train-route {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0;
        }

        .train-eta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Map Container Centered */
        #map {
            flex: 1;
            background-color: #0b0e14;
        }

        /* Dark mode filter for Leaflet Map Tiles */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Sidebar Right: Active Train Detail Panel */
        .sidebar-right {
            width: 360px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .detail-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .detail-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .info-label {
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .info-value {
            font-weight: bold;
        }

        /* Timeline / Itinerary Styling */
        .timeline {
            position: relative;
            padding-left: 24px;
            margin-top: 10px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background-color: var(--border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-marker {
            position: absolute;
            left: -22px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--bg-sidebar);
            border: 2px solid var(--text-muted);
        }

        .timeline-item.passed .timeline-marker {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .timeline-item.current .timeline-marker {
            background-color: #58a6ff;
            border-color: #58a6ff;
            box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.3);
        }

        .timeline-content {
            font-size: 0.85rem;
        }

        .station-name {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .station-time {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Map Legend Overlay */
        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 340px;
            background-color: rgba(22, 27, 34, 0.9);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 6px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            pointer-events: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <header>
        <div class="logo-area">
            <span>🚇 Trenes España</span>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>En directo</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-item active">🗺️ Mapa</a>
            <a href="#" class="nav-item">🚄 Trenes</a>
            <a href="#" class="nav-item">⚠️ Incidencias</a>
            <a href="#" class="nav-item">📊 Estadísticas</a>
        </nav>
    </header>

    <!-- Content Workspace -->
    <div class="workspace">
        
        <!-- Sidebar Left -->
        <aside class="sidebar-left">
            <input type="text" id="searchBar" class="search-box" placeholder="Buscar tren, origen o destino...">
            
            <div class="filter-tags">
                <button class="filter-tag active" data-type="all">Todos <span id="count-all">0</span></button>
                <button class="filter-tag" data-type="ave">AVE <span id="count-ave">0</span></button>
                <button class="filter-tag" data-type="avlo">AVLO <span id="count-avlo">0</span></button>
                <button class="filter-tag" data-type="alvia">ALVIA <span id="count-alvia">0</span></button>
                <button class="filter-tag" data-type="md">Media Dist. <span id="count-md">0</span></button>
                <button class="filter-tag" data-type="cercanias">Cercanías <span id="count-cercanias">0</span></button>
            </div>

            <div class="train-list" id="trainListContainer">
                <!-- Cards injected via JS -->
            </div>
        </aside>

        <!-- Centered Map Container -->
        <main style="position: relative; flex: 1; display: flex;">
            <div id="map"></div>
            
            <!-- Map Legend Layout Overlay -->
            <div class="map-legend">
                <div class="legend-item"><div class="legend-color" style="background-color: var(--accent-ave);"></div>AVE</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--accent-avlo);"></div>AVLO</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--accent-alvia);"></div>Alvia</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--accent-md);"></div>M.D.</div>
                <div class="legend-item"><div class="legend-color" style="background-color: var(--accent-cercanias);"></div>Cercanías</div>
            </div>
        </main>

        <!-- Sidebar Right -->
        <aside class="sidebar-right" id="detailPanel">
            <!-- Details injected dynamically via JS -->
        </aside>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // --- DATASET INTEGRADO (Mock realístico que simula feeds dinámicos) ---
        const trainsData = [
            {
                id: "AVE03121",
                type: "ave",
                name: "AVE 03121",
                route: "Madrid P. Atocha → Barcelona Sants",
                eta: "15:42",
                status: "En marcha",
                speed: 298,
                progress: "332 km / 621 km (53%)",
                delay: "-2 min",
                locationName: "Cerca de Guadalajara",
                coords: [40.4500, -3.1500],
                itinerary: [
                    { station: "Madrid P. Atocha", time: "Salida: 13:00", state: "passed" },
                    { station: "Guadalajara", time: "Paso: 13:29", state: "current" },
                    { station: "Zaragoza Delicias", time: "Prevista: 14:48", state: "upcoming" },
                    { station: "Barcelona Sants", time: "Prevista: 15:42", state: "upcoming" }
                ]
            },
            {
                id: "AVE03092",
                type: "ave",
                name: "AVE 03092",
                route: "Barcelona Sants → Sevilla S. Justa",
                eta: "16:58",
                status: "En marcha",
                speed: 284,
                progress: "410 km / 1024 km (40%)",
                delay: "+5 min",
                locationName: "Pasando Zaragoza",
                coords: [41.6488, -0.8891],
                itinerary: [
                    { station: "Barcelona Sants", time: "Salida: 12:45", state: "passed" },
                    { station: "Zaragoza Delicias", time: "Paso: 14:20", state: "current" },
                    { station: "Madrid P. Atocha", time: "Prevista: 15:55", state: "upcoming" },
                    { station: "Sevilla S. Justa", time: "Prevista: 16:58", state: "upcoming" }
                ]
            },
            {
                id: "AVLO00613",
                type: "avlo",
                name: "AVLO 00613",
                route: "Madrid P. Atocha → Valencia J. Sorolla",
                eta: "14:49",
                status: "En marcha",
                speed: 295,
                progress: "180 km / 390 km (46%)",
                delay: "0 min",
                locationName: "Provincia de Cuenca",
                coords: [40.0700, -2.1300],
                itinerary: [
                    { station: "Madrid P. Atocha", time: "Salida: 13:30", state: "passed" },
                    { station: "Cuenca Fernando Zóbel", time: "Paso: 14:12", state: "current" },
                    { station: "Valencia J. Sorolla", time: "Prevista: 14:49", state: "upcoming" }
                ]
            },
            {
                id: "ALVIA04171",
                type: "alvia",
                name: "ALVIA 04171",
                route: "A Coruña → Madrid Chamartín",
                eta: "15:26",
                status: "En marcha",
                speed: 210,
                progress: "420 km / 605 km (69%)",
                delay: "0 min",
                locationName: "Cerca de Valladolid",
                coords: [41.6522, -4.7245],
                itinerary: [
                    { station: "A Coruña", time: "Salida: 10:15", state: "passed" },
                    { station: "Ourense", time: "Paso: 11:30", state: "passed" },
                    { station: "Zamora", time: "Paso: 13:45", state: "current" },
                    { station: "Madrid Chamartín", time: "Prevista: 15:26", state: "upcoming" }
                ]
            },
            {
                id: "MD18205",
                type: "md",
                name: "MD 18205",
                route: "Zaragoza Delicias → Huesca",
                eta: "14:38",
                status: "En marcha",
                speed: 120,
                progress: "45 km / 82 km (54%)",
                delay: "+1 min",
                locationName: "Próximo a Tardienta",
                coords: [41.9768, -0.5367],
                itinerary: [
                    { station: "Zaragoza Delicias", time: "Salida: 13:40", state: "passed" },
                    { station: "Tardienta", time: "Paso: 14:15", state: "current" },
                    { station: "Huesca", time: "Prevista: 14:38", state: "upcoming" }
                ]
            },
            {
                id: "C1BARC",
                type: "cercanias",
                name: "C1 Barcelona",
                route: "L'Hospitalet → Mataró",
                eta: "Próxima: Badalona (14:21)",
                status: "En marcha",
                speed: 75,
                progress: "Frecuencia regular",
                delay: "0 min",
                locationName: "Tramo Urbano",
                coords: [41.4500, 2.2474],
                itinerary: [
                    { station: "L'Hospitalet", time: "Salida: 13:55", state: "passed" },
                    { station: "Barcelona Sants", time: "Paso: 14:05", state: "passed" },
                    { station: "Badalona", time: "Llegada: 14:21", state: "current" },
                    { station: "Mataró", time: "Prevista: 14:45", state: "upcoming" }
                ]
            }
        ];

        // --- MAP INITIALIZATION ---
        const map = L.map('map', { zoomControl: false }).setView([40.4167, -3.7037], 6); // Centro de España
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // --- GLOBAL VARIABLES ---
        let currentFilter = 'all';
        let searchQuery = '';
        let markersGroup = L.layerGroup().addTo(map);
        let selectedTrainId = trainsData[0].id; // Seleccionar el primero por defecto

        // Color mapper for markers
        const typeColors = {
            ave: '#b620e0',
            avlo: '#9e005d',
            alvia: '#0070f3',
            md: '#e056fd',
            cercanias: '#00a8ff'
        };

        // --- RENDER ENGINE ---

        function updateCounters() {
            document.getElementById('count-all').innerText = trainsData.length;
            ['ave', 'avlo', 'alvia', 'md', 'cercanias'].forEach(type => {
                const count = trainsData.filter(t => t.type === type).length;
                document.getElementById(`count-${type}`).innerText = count;
            });
        }

        function renderTrainList() {
            const container = document.getElementById('trainListContainer');
            container.innerHTML = '';

            const filtered = trainsData.filter(train => {
                const matchesFilter = currentFilter === 'all' || train.type === currentFilter;
                const matchesSearch = train.name.toLowerCase().includes(searchQuery) || 
                                      train.route.toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            filtered.forEach(train => {
                const card = document.createElement('div');
                card.className = `train-card ${train.id === selectedTrainId ? 'selected' : ''}`;
                card.onclick = () => selectTrain(train.id);

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge ${train.type}">${train.type.toUpperCase()}</span>
                        <span class="status-dot">● ${train.status}</span>
                    </div>
                    <div class="train-name">${train.name}</div>
                    <div class="train-route">${train.route}</div>
                    <div class="train-eta">Llegada prevista: ${train.eta}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderMarkers() {
            markersGroup.clearLayers();

            trainsData.forEach(train => {
                // Verificar si pasa los filtros actuales para mostrarse en mapa
                const matchesFilter = currentFilter === 'all' || train.type === currentFilter;
                const matchesSearch = train.name.toLowerCase().includes(searchQuery) || 
                                      train.route.toLowerCase().includes(searchQuery);
                
                if (matchesFilter && matchesSearch) {
                    const color = typeColors[train.type] || '#fff';
                    
                    // Icono de circulo personalizado estilo radar ferroviario
                    const customIcon = L.divIcon({
                        className: 'custom-train-marker',
                        html: `<div style="background-color: ${color}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 8px ${color};"></div>`,
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    });

                    const marker = L.marker(train.coords, { icon: customIcon })
                        .bindPopup(`<b>${train.name}</b><br>${train.route}`)
                        .addTo(markersGroup);

                    marker.on('click', () => {
                        selectTrain(train.id);
                    });
                }
            });
        }

        function renderRightPanel() {
            const panel = document.getElementById('detailPanel');
            const train = trainsData.find(t => t.id === selectedTrainId);

            if (!train) {
                panel.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 40px;">Selecciona un tren del mapa o de la lista para ver su recorrido detallado.</div>';
                return;
            }

            const delayClass = train.delay.includes('+') ? 'color: #ff4d4d;' : train.delay.includes('-') ? 'color: var(--accent-green);' : '';

            let itineraryHTML = '';
            train.itinerary.forEach(item => {
                itineraryHTML += `
                    <div class="timeline-item ${item.state}">
                        <div class="timeline-marker"></div>
                        <div class="timeline-content">
                            <div class="station-name">${item.station}</div>
                            <div class="station-time">${item.time}</div>
                        </div>
                    </div>
                `;
            });

            panel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">
                        <h2>${train.name}</h2>
                        <span class="badge ${train.type}">${train.type.toUpperCase()}</span>
                    </div>
                    <p style="color: var(--accent-green); font-size: 0.85rem;">● En marcha</p>
                    <p style="font-size: 0.9rem; margin-top: 8px; font-weight: 500;">${train.route}</p>
                </div>

                <div class="info-grid">
                    <div>
                        <div class="info-label">📍 Ubicación actual</div>
                        <div class="info-value">${train.locationName}</div>
                    </div>
                    <div>
                        <div class="info-label">⚡ Velocidad</div>
                        <div class="info-value">${train.speed} km/h</div>
                    </div>
                    <div>
                        <div class="info-label">🕒 Llegada prevista</div>
                        <div class="info-value">${train.eta} <span style="${delayClass}">${train.delay}</span></div>
                    </div>
                    <div>
                        <div class="info-label">📈 Recorrido</div>
                        <div class="info-value" style="font-size: 0.75rem;">${train.progress}</div>
                    </div>
                </div>

                <h3 style="font-size: 1rem; margin-bottom: 15px; border-top: 1px solid var(--border); padding-top: 15px;">📋 Itinerario del Viaje</h3>
                <div class="timeline">
                    ${itineraryHTML}
                </div>
            `;
        }

        function selectTrain(id) {
            selectedTrainId = id;
            renderTrainList();
            renderRightPanel();

            const train = trainsData.find(t => t.id === id);
            if (train) {
                map.flyTo(train.coords, 8, { animate: true, duration: 1.5 });
            }
        }

        // --- INTERACTION LOGIC (EVENT LISTENERS) ---

        // Search Input
        document.getElementById('searchBar').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderTrainList();
            renderMarkers();
        });

        // Category Filter Buttons
        document.querySelectorAll('.filter-tag').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
                
                const btn = e.currentTarget;
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-type');
                
                renderTrainList();
                renderMarkers();
            });
        });

        // --- INITIAL RUN ---
        updateCounters();
        renderTrainList();
        renderMarkers();
        renderRightPanel();

        // Auto pan to first train on launch
        if(trainsData.length > 0) {
            map.setView(trainsData[0].coords, 7);
        }

    </script>
</body>
</html>
